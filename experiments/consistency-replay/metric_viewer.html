<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metric Disagreement — per model</title>
<style>
  :root{
    --bg:#0f1420; --panel:#161d2e; --panel2:#1d2740; --edge:#2a3550;
    --ink:#e7ecf5; --muted:#94a3c4; --accent:#6ea8fe; --good:#3ddc84;
    --warn:#ffcf5c; --bad:#ff6b6b; --add:#1f6f43; --del:#7a2230;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:var(--bg);color:var(--ink)}
  header{padding:16px 24px;border-bottom:1px solid var(--edge);background:linear-gradient(180deg,#141b2c,#0f1420)}
  header h1{margin:0 0 4px;font-size:19px}
  header .sub{color:var(--muted);font-size:13px}
  /* model tabs */
  .tabs{display:flex;gap:6px;padding:10px 24px 0;border-bottom:1px solid var(--edge);background:var(--bg);
        flex-wrap:wrap}
  .tab{padding:9px 15px;cursor:pointer;border:1px solid var(--edge);border-bottom:none;
       border-radius:9px 9px 0 0;color:var(--muted);font-size:13px;background:var(--panel)}
  .tab:hover{color:var(--ink)}
  .tab.active{color:var(--ink);background:var(--panel2);border-color:var(--accent);
              box-shadow:0 -2px 0 var(--accent) inset}
  .tab .n{color:var(--muted);font-size:11px;margin-left:6px}
  .wrap{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 128px)}
  /* sidebar: metric list */
  .side{border-right:1px solid var(--edge);overflow-y:auto;max-height:calc(100vh - 128px);background:var(--panel)}
  .side h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 16px 8px}
  .metric{padding:9px 16px;cursor:pointer;border-left:3px solid transparent}
  .metric:hover{background:var(--panel2)}
  .metric.active{background:var(--panel2);border-left-color:var(--accent)}
  .metric .name{font-weight:600;font-size:13px}
  .metric .gloss{color:var(--muted);font-size:11px;margin-top:2px}
  .metric .counts{display:flex;gap:6px;margin-top:5px}
  .cbadge{font-size:10px;padding:1px 6px;border-radius:999px;border:1px solid var(--edge);color:var(--muted)}
  .cbadge.s{color:var(--good);border-color:#2a5d40}
  .cbadge.d{color:var(--bad);border-color:#5d2a2a}
  /* main */
  .main{overflow-y:auto;max-height:calc(100vh - 128px);padding:20px 24px}
  .mhead{margin-bottom:6px}
  .mhead h2{margin:0;font-size:17px}
  .mhead .gloss{color:var(--muted);font-size:13px;margin-top:3px}
  .thr{color:var(--muted);font-size:12px;margin:10px 0 18px}
  .thr code{background:var(--panel2);border:1px solid var(--edge);border-radius:4px;padding:1px 6px}
  .dirsec{margin-bottom:26px}
  .dirhead{display:flex;align-items:center;gap:9px;margin-bottom:4px}
  .dirhead .tag{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;text-transform:uppercase;
                letter-spacing:.04em}
  .dirhead .tag.s{color:#08101f;background:var(--good)}
  .dirhead .tag.d{color:#08101f;background:var(--bad)}
  .dirhead h3{margin:0;font-size:14px;font-weight:600}
  .dirsub{color:var(--muted);font-size:12px;margin:2px 0 12px}
  .empty{color:var(--muted);padding:20px;text-align:center;background:var(--panel);border:1px dashed var(--edge);
         border-radius:10px}
  /* example card */
  .ex{background:var(--panel);border:1px solid var(--edge);border-radius:11px;padding:13px 15px;margin-bottom:14px}
  .ex .extop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
  .ex .grp{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted)}
  .ex .runs{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--accent)}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--edge);white-space:nowrap}
  .pill.good{color:var(--good);border-color:#2a5d40}
  .pill.warn{color:var(--warn);border-color:#5d5326}
  .pill.bad{color:var(--bad);border-color:#5d2a2a}
  .pill.info{color:var(--accent);border-color:#2a405d}
  /* full metric vector chips */
  .vec{display:flex;gap:5px;flex-wrap:wrap;margin:9px 0 11px}
  .chip{font-size:10.5px;padding:2px 7px;border-radius:6px;border:1px solid var(--edge);
        font-family:ui-monospace,Menlo,monospace;color:var(--muted);background:#121a2b}
  .chip .cv{font-weight:700}
  .chip.target{border-color:var(--accent);color:var(--ink);box-shadow:0 0 0 1px var(--accent) inset}
  .chip.opp{border-color:var(--warn);color:var(--warn)}
  .chip.gd .cv{color:var(--good)} .chip.wn .cv{color:var(--warn)} .chip.bd .cv{color:var(--bad)}
  /* two run columns + diff */
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .col{background:#121a2b;border:1px solid var(--edge);border-radius:8px;padding:10px;min-width:0}
  .col h4{margin:0 0 6px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
  .col .fr{font-family:ui-monospace,Menlo,monospace}
  .col .tools{font-size:11px;color:#c9a6ff;font-family:ui-monospace,Menlo,monospace;margin-bottom:6px;
              word-break:break-word}
  .col .txt{font-family:ui-monospace,Menlo,monospace;font-size:12px;white-space:pre-wrap;word-break:break-word;
            max-height:300px;overflow:auto;color:#d5def3}
  ins{background:var(--add);text-decoration:none;border-radius:2px}
  del{background:var(--del);text-decoration:none;border-radius:2px}
  .legend{color:var(--muted);font-size:11px;margin-top:8px}
  .toolcall{color:#c9a6ff}
</style>
</head>

<div class="wrap">
  <aside class="side">

    <div id="metriclist"></div>

</div>

<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const HI = DATA.thresholds.hi, LO = DATA.thresholds.lo;
const METRICS = DATA.metrics;                 // [{key,label,gloss}]
const MLABEL = {}; METRICS.forEach(m=>MLABEL[m.key]=m.label);
let state = {model:0, metric:METRICS[0].key};

function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function fmt(v){return v==null?'–':(+v).toFixed(2);}
function cls(v){ if(v==null)return ''; return v>=HI?'gd':v>=LO?'wn':'bd'; }

// Whitespace-ignoring char diff (same approach as the main viewer): only genuinely
// different non-whitespace chars get <ins>/<del>; original text rendered verbatim.
function diffWords(a,b){
  a=a||''; b=b||'';
  const ca=[],ia=[]; for(let k=0;k<a.length;k++){if(!/\s/.test(a[k])){ca.push(a[k]);ia.push(k);}}
  const cb=[],ib=[]; for(let k=0;k<b.length;k++){if(!/\s/.test(b[k])){cb.push(b[k]);ib.push(k);}}
  const n=ca.length,m=cb.length;
  const dp=Array.from({length:n+1},()=>new Int32Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)
    dp[i][j]=ca[i]===cb[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const sA=new Array(n).fill(false),sB=new Array(m).fill(false);
  let i=0,j=0;
  while(i<n&&j<m){ if(ca[i]===cb[j]){sA[i]=sB[j]=true;i++;j++;} else if(dp[i+1][j]>=dp[i][j+1])i++; else j++; }
  const render=(s,idxs,shared,tag)=>{
    let out='',p=0;
    for(let k=0;k<idxs.length;k++){ out+=esc(s.slice(p,idxs[k]));
      const ch=esc(s[idxs[k]]); out+=shared[k]?ch:`<${tag}>${ch}</${tag}>`; p=idxs[k]+1; }
    out+=esc(s.slice(p)); return out;
  };
  const tidy=h=>h.replace(/<\/(ins|del)>(<\1>)/g,'');
  return [tidy(render(a,ia,sA,'del')), tidy(render(b,ib,sB,'ins'))];
}

function sideText(side){
  if(side.content && side.content.trim()) return side.content;
  if(side.tool_calls && side.tool_calls.length)
    return side.tool_calls.map(t=>`${t.name}(${t.arguments||''})`).join('\n');
  return '';
}

function renderTabs(){
  document.getElementById('tabs').innerHTML = DATA.models.map((m,i)=>
    `<div class="tab ${i===state.model?'active':''}" data-i="${i}">${esc(m.label)}
       <span class="n">${m.n_pairs} pairs</span></div>`).join('');
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
    state.model=+t.dataset.i; render();
  });
  const mm=DATA.models[state.model];
  document.getElementById('subtitle').textContent =
    `${mm.label} · ${mm.n_groups} identical-input groups · ${mm.n_pairs} run-pairs · `
    +`“similar” ≥ ${HI}, “differ” ≤ ${LO}`;
}

function renderSidebar(){
  const ex = DATA.models[state.model].examples;
  document.getElementById('metriclist').innerHTML = METRICS.map(m=>{
    const e=ex[m.key]||{};
    const ns=(e.similar_but_differ||[]).length, nd=(e.differ_but_similar||[]).length;
    return `<div class="metric ${m.key===state.metric?'active':''}" data-k="${m.key}">
      <div class="name">${esc(m.label)}</div>
      <div class="gloss">${esc(m.gloss)}</div>
      <div class="counts">
        <span class="cbadge s" title="this metric says similar, others differ">S:${ns}</span>
        <span class="cbadge d" title="this metric says differ, others similar">D:${nd}</span>
      </div></div>`;
  }).join('');
  document.querySelectorAll('.metric').forEach(el=>el.onclick=()=>{
    state.metric=el.dataset.k; renderMain();
  });
}

function chip(mk, v, target, opposing){
  const isT = mk===target, isO = opposing.includes(mk);
  return `<span class="chip ${cls(v)} ${isT?'target':''} ${isO?'opp':''}">`
    +`${esc(MLABEL[mk])} <span class="cv">${fmt(v)}</span></span>`;
}

function renderExample(exa, target){
  const [dA,dB]=diffWords(sideText(exa.a), sideText(exa.b));
  const vecChips = METRICS.map(m=>chip(m.key, exa.vector[m.key], target, exa.opposing)).join('');
  const col=(tag,side,diffHtml)=>{
    const tools = side.tools && side.tools.length ? `<div class="tools">tools: ${esc(side.tools.join(' → '))}</div>` : '';
    return `<div class="col"><h4><span>${tag}</span><span class="fr">finish=${esc(side.finish_reason||'–')}</span></h4>
      ${tools}<div class="txt">${diffHtml}</div></div>`;
  };
  const oppText = exa.opposing.map(m=>MLABEL[m]).join(', ');
  const trivial = exa.trivial
    ? `<span class="pill warn" title="both sides are empty of what this metric measures — the high score is true-by-emptiness, not real agreement">trivial (empty vs empty)</span>` : '';
  return `<div class="ex">
    <div class="extop">
      <span class="grp">${esc(exa.event_short)}</span>
      <span class="runs">${esc(exa.run_a)} vs ${esc(exa.run_b)}</span>
      <span class="pill ${cls(exa.target_value)}">${esc(MLABEL[target])} = ${fmt(exa.target_value)}</span>
      <span class="pill info">disagrees with: ${esc(oppText)}</span>
      ${trivial}
    </div>
    <div class="vec">${vecChips}</div>
    <div class="cols">${col(exa.run_a, exa.a, dA)}${col(exa.run_b, exa.b, dB)}</div>
  </div>`;
}

function renderDir(list, target, kind){
  const tag = kind==='s'
    ? {cls:'s', title:`“${MLABEL[target]}” says SIMILAR — other metrics say DIFFER`,
       sub:`${MLABEL[target]} ≥ ${HI}, yet at least one other metric ≤ ${LO}. This metric alone would call these runs consistent.`}
    : {cls:'d', title:`“${MLABEL[target]}” says DIFFER — other metrics say SIMILAR`,
       sub:`${MLABEL[target]} ≤ ${LO}, yet at least one other metric ≥ ${HI}. This metric alone flags a difference the others miss.`};
  const body = (list && list.length)
    ? list.map(e=>renderExample(e,target)).join('')
    : `<div class="empty">No examples found for this model at the current thresholds.</div>`;
  return `<div class="dirsec">
    <div class="dirhead"><span class="tag ${tag.cls}">${kind==='s'?'similar':'differ'}</span>
      <h3>${esc(tag.title)}</h3></div>
    <div class="dirsub">${esc(tag.sub)}</div>
    ${body}</div>`;
}

function renderMain(){
  renderSidebar();
  const meta = METRICS.find(m=>m.key===state.metric);
  const ex = DATA.models[state.model].examples[state.metric]||{};
  document.getElementById('main').innerHTML = `
    <div class="mhead"><h2>${esc(meta.label)}</h2><div class="gloss">${esc(meta.gloss)}</div></div>
    <div class="thr">Thresholds: <code>similar ≥ ${HI}</code> · <code>differ ≤ ${LO}</code>.
       The <b>full metric vector</b> is shown per example; the
       <span class="chip target" style="padding:0 6px">target</span> metric and the
       <span class="chip opp" style="padding:0 6px">opposing</span> metrics are highlighted.</div>
    ${renderDir(ex.similar_but_differ, state.metric, 's')}
    ${renderDir(ex.differ_but_similar, state.metric, 'd')}
    <div class="legend">Diff highlights ignore whitespace: <del>red</del> = only in the left run,
       <ins>green</ins> = only in the right run.</div>`;
}

function render(){ renderTabs(); renderMain(); }
render();
</script>
</body>
</html>
