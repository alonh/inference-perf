# Consistency experiment: first 10 exgentic agent traces, replayed against a live
# RITS endpoint with output substitution DISABLED.
#
# disable_output_substitution: true is the linchpin. With it on, every turn always
# sends the RECORDED prior context, so across the 10 independent process runs of this
# config, each (trace, call-position) is fed BYTE-IDENTICAL input. Any difference in
# the outputs is therefore pure model/server nondeterminism (sampling + vLLM batching
# + KV-cache), not compounding cascade drift from live predecessor outputs.
#
# Run this config 10 times (see run_consistency.sh in this directory), overriding the
# storage path per iteration via --storage.local_storage.path. Sampling is left at the
# server default (no temperature override) to measure real-world consistency.

api:
  type: chat
  streaming: false
  headers:
    # Placeholder — the runner (run_consistency.sh) injects the real key from the
    # RITS_API_KEY environment variable via a CLI override. If you invoke
    # inference_perf.main directly, pass the whole headers dict as a JSON string:
    #   --api.headers "{\"RITS_API_KEY\":\"$RITS_API_KEY\"}"
    RITS_API_KEY: "SET_VIA_ENV"

data:
  type: otel_trace_replay
  otel_trace_replay:
    hf_dataset_path: "Exgentic/agent-llm-traces"

    use_static_model: true
    static_model_name: "Qwen/Qwen3-VL-235B-A22B-Instruct"

    # The whole point of the experiment: replay recorded outputs as-is so inputs
    # are identical across repetitions.
    disable_output_substitution: true

    default_max_tokens: 200

    # Cap the recorded inter-event delay (harness default is 15000 ms). The replay
    # reproduces the original trace's think/tool gaps between calls; at 10 ms it fires
    # each session's events back-to-back instead, so a cell finishes in a fraction of
    # the wall-clock time. This is a PACING knob only — with
    # disable_output_substitution: true the request bodies are unaffected, so what each
    # call sends is byte-identical either way. It does change server-side
    # queueing/batching timing, so note it when comparing against corpora collected
    # before 2026-08-12, which ran at the 15 s default.
    max_wait_ms: 10

    include_errors: false
    skip_invalid_files: true

load:
  type: trace_session_replay
  stages:
    # Exactly the first 10 sessions of the corpus, run together.
    - concurrent_sessions: 10
      num_sessions: 10
  worker_max_concurrency: 20
  # Fixed seed so the SAME 10 traces are selected on every one of the 10 process runs.
  base_seed: 41

server:
  type: vllm
  base_url: "https://inference-3scale-apicast-production.apps.rits.fmaas.res.ibm.com/qwen3-vl-235b-a22b-instruct"
  model_name: "Qwen/Qwen3-VL-235B-A22B-Instruct"

storage:
  local_storage:
    # Default; the runner overrides this per iteration with
    #   --storage.local_storage.path reports-consistency/run_<i>
    path: "reports-consistency/run_default"

report:
  request_lifecycle:
    summary: true
    per_stage: false
    # REQUIRED: persists full request + response bodies per call. This is the
    # data the analyzer consumes to compare the 10 copies of each call.
    per_request: true
